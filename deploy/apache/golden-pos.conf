# =====================================================================
#  Golden Pos - Hôte virtuel Apache (XAMPP, Apache 2.4)
#
#  Installation (une fois, sur le poste serveur) :
#   1. Adapter GOLDEN_POS ci-dessous au dossier du projet (barres obliques « / »).
#   2. Ajouter à la fin de C:\xampp\apache\conf\extra\httpd-vhosts.conf :
#        Include "C:/works/pigmasoft/pos/pos-taillecolors/deploy/apache/golden-pos.conf"
#   3. Vérifier la configuration :  C:\xampp\apache\bin\httpd.exe -t
#   4. Redémarrer Apache depuis le panneau XAMPP.
#   5. Ouvrir http://<nom-ou-ip-du-poste>:8080 depuis les caisses du réseau local.
#
#  Le module mod_rewrite (déjà chargé dans httpd.conf) est utilisé par public/.htaccess.
# =====================================================================

Define GOLDEN_POS "C:/works/pigmasoft/pos/pos-taillecolors"

# Modules de performance (désactivés par défaut dans XAMPP) : compression et cache navigateur
<IfModule !filter_module>
    LoadModule filter_module modules/mod_filter.so
</IfModule>
<IfModule !deflate_module>
    LoadModule deflate_module modules/mod_deflate.so
</IfModule>
<IfModule !expires_module>
    LoadModule expires_module modules/mod_expires.so
</IfModule>

Listen 8080

<VirtualHost *:8080>
    ServerName golden-pos.local
    DocumentRoot "${GOLDEN_POS}/public"

    <Directory "${GOLDEN_POS}/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        # Accès réservé au réseau local du magasin
        Require ip 127.0.0.1 ::1 192.168 10 172.16.0.0/12
    </Directory>

    # Aucun accès direct au code, à la configuration ou aux journaux
    <DirectoryMatch "^${GOLDEN_POS}/(app|bootstrap|config|database|deploy|resources|routes|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    # Compression des réponses texte (pages, scripts, styles, JSON de la caisse) : 70 à 80 % de moins sur le réseau
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript text/javascript application/json image/svg+xml

    # Cache navigateur des fichiers statiques
    ExpiresActive On
    # Scripts de la caisse : URL versionnée (?v=date du fichier), donc cache d'un an sans risque
    <LocationMatch "^/js/">
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # Bibliothèques et polices locales (public/vendor), images
    <LocationMatch "^/vendor/">
        ExpiresDefault "access plus 30 days"
    </LocationMatch>
    <LocationMatch "\.(ico|png|jpg|svg)$">
        ExpiresDefault "access plus 7 days"
    </LocationMatch>

    ErrorLog "logs/golden-pos-error.log"
    CustomLog "logs/golden-pos-access.log" common
</VirtualHost>

# ---------------------------------------------------------------------
